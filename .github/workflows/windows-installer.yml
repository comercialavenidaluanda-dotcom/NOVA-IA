name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/web-first-vercel
    tags:
      - "v*"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build application
        run: npm run build
      - name: Package Windows installer
        if: github.event_name != 'pull_request' || github.head_ref == 'feature/web-first-vercel'
        run: npm run dist:win
      - name: Upload installer
        if: github.event_name != 'pull_request' || github.head_ref == 'feature/web-first-vercel'
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-studio-windows
          path: release/*.exe
          if-no-files-found: error
